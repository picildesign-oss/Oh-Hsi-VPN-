name: Oh Hsi VPN Build

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    # 1. Java 17 Setup
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    # 2. Go Setup
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.22'

    # 3. Setup Android SDK & NDK automatically via SDK Manager
    - name: Setup Android SDK and NDK
      uses: android-actions/setup-android@v3
      with:
        packages: 'ndk;26.1.10909125 platforms;android-34 build-tools;34.0.0'

    # 4. Grant execute permission for gradlew
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # 5. Build Debug APK
    - name: Build Debug APK
      run: ./gradlew assembleDebug --stacktrace

    # 6. Upload APK Artifact
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: OhHsiVPN-APK
        path: ui/build/outputs/apk/debug/*.apk
