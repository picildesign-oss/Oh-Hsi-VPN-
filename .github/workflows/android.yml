name: Oh Hsi VPN Build

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    # 1. Java 17 Setup
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    # 2. Go Setup (WireGuard tunnel module အတွက် မဖြစ်မနေ လိုအပ်ပါသည်)
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.22'

    # 3. Executable Permission ပေးခြင်း
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # 4. Build Debug APK (Stacktrace အပြည့်အစုံကြည့်နိုင်ရန် --stacktrace ထည့်ထားသည်)
    - name: Build Debug APK
      run: ./gradlew assembleDebug --stacktrace

    # 5. Build ပြီးပါက APK ကို Artifact အဖြစ် Upload တင်ခြင်း
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: OhHsiVPN-APK
        path: ui/build/outputs/apk/debug/*.apk
